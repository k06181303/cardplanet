<p>卡牌星球後台是「卡牌星球 TCG」店家自用的管理工具，在店家自己的電腦上執行，用來管理商品庫存、預購登記、付款與出貨狀態。</p>
<p>本工具會使用店家本人的 Google 帳號，在該帳號中建立預購用的 Google 表單、讀取表單回覆，並將商品圖片上傳到該帳號的 Google 雲端硬碟。本工具不對外開放，也不提供其他使用者登入。</p>
